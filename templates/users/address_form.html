{% extends 'base.html' %}
{% block title %}{{ title }} – LuxeMart{% endblock %}
{% block content %}
<div class="page-hero" style="padding:2rem 0;"><div class="container">
  <div class="breadcrumb-luxe mb-2">
    <a href="{% url 'store:home' %}">Home</a><span class="breadcrumb-sep">/</span>
    <a href="{% url 'users:profile' %}">Profile</a><span class="breadcrumb-sep">/</span>
    <span>{{ title }}</span>
  </div>
  <h1>{{ title }}</h1>
</div></div>
<section class="section-sm"><div class="container" style="max-width:640px;">
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2.5rem;box-shadow:var(--shadow-md);">
    <form method="post" novalidate>{% csrf_token %}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        {% for field in form %}
        <div class="form-group" style="{% if field.name in 'address_line_1,address_line_2' %}grid-column:span 2;{% endif %}margin-bottom:0;">
          <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
          {{ field }}
          {% if field.errors %}<p style="color:#ef4444;font-size:0.78rem;margin-top:0.3rem;">{{ field.errors.0 }}</p>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div style="display:flex;gap:1rem;margin-top:1.75rem;">
        <button type="submit" class="btn-luxe btn-primary" style="flex:1;">Save Address</button>
        <a href="{% url 'users:profile' %}" class="btn-luxe btn-dark-outline" style="flex:1;text-align:center;">Cancel</a>
      </div>
    </form>
  </div>
</div></section>
{% endblock %}
