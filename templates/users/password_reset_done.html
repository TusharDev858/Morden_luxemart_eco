{% extends 'base.html' %}
{% block title %}Check Your Email – LuxeMart{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:3rem 1rem;background:var(--bg-secondary);">
  <div style="width:100%;max-width:440px;text-align:center;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:3rem;box-shadow:var(--shadow-lg);">
      <div style="width:72px;height:72px;background:rgba(16,185,129,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;"><i class="bi bi-envelope-check-fill" style="color:#10b981;font-size:1.8rem;"></i></div>
      <h1 class="display-font" style="font-size:2rem;margin-bottom:0.75rem;">Email Sent!</h1>
      <p style="color:var(--text-muted);line-height:1.7;margin-bottom:1.5rem;">We've sent password reset instructions to your email. Check your inbox (and spam folder).</p>
      <a href="{% url 'users:login' %}" class="btn-luxe btn-primary">Back to Login</a>
    </div>
  </div>
</div>{% endblock %}
