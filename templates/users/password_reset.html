{% extends 'base.html' %}
{% block title %}Reset Password – LuxeMart{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:3rem 1rem;background:var(--bg-secondary);">
  <div style="width:100%;max-width:440px;">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2.5rem;box-shadow:var(--shadow-lg);">
      <div style="text-align:center;margin-bottom:2rem;">
        <div style="width:64px;height:64px;background:rgba(184,147,90,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;"><i class="bi bi-lock-fill" style="color:var(--gold);font-size:1.5rem;"></i></div>
        <h1 class="display-font" style="font-size:2rem;margin-bottom:0.5rem;">Reset Password</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">Enter your email and we'll send a reset link.</p>
      </div>
      <form method="post" novalidate>{% csrf_token %}
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
        </div>
        <button type="submit" class="btn-luxe btn-primary w-100" style="padding:1rem;">Send Reset Link <i class="bi bi-arrow-right"></i></button>
      </form>
      <div style="text-align:center;margin-top:1.5rem;"><a href="{% url 'users:login' %}" style="font-size:0.875rem;color:var(--gold);">← Back to Login</a></div>
    </div>
  </div>
</div>{% endblock %}
